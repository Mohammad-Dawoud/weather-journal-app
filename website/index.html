<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Journal App</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:," />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main id="app">
      <header>
        <h1 class="holder headline">Weather Journal App</h1>
        <p class="fixture-note">
          Local demo using fixture weather. Use a short sample note.
        </p>
      </header>

      <form id="journalForm">
        <div class="holder zip">
          <label for="zip">Enter Zipcode here</label>
          <input
            type="text"
            id="zip"
            name="zip"
            inputmode="numeric"
            autocomplete="off"
            placeholder="enter zip code here"
            maxlength="5"
            pattern="[0-9]{5}"
            aria-describedby="zipHint"
            required
          />
          <small id="zipHint"
            >Fixture ZIPs include 02139, 10001 and 90210.</small
          >
        </div>
        <div class="holder feel">
          <label for="feelings">How are you feeling today?</label>
          <textarea
            class="myInput"
            id="feelings"
            name="feelings"
            placeholder="Enter your feelings here"
            rows="9"
            cols="50"
            maxlength="500"
            required
          ></textarea>
          <button id="generate" type="submit" disabled>Generate</button>
        </div>
        <p id="status" role="status"></p>
      </form>

      <section class="holder entry" aria-labelledby="entryTitle">
        <h2 class="title" id="entryTitle">Most Recent Entry</h2>
        <p id="emptyEntry">No entry yet.</p>
        <div id="entryHolder" hidden>
          <div id="date"></div>
          <div id="temp"></div>
          <div id="content"></div>
        </div>
      </section>
    </main>
  </body>
</html>
